<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}}</title>
    <link rel="icon" href="{{icon_asset}}">
    <link rel="stylesheet" href="{{styles_asset}}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="GoE Guild Portal home">
        <img class="guild-icon" src="{{icon_asset}}" alt="">
        <span class="brand-copy"><strong>GoE</strong><span>Guild Portal</span></span>
      </a>
      <nav class="main-nav" aria-label="Primary navigation">{{navigation}}</nav>
      <details class="mobile-nav">
        <summary aria-label="Open navigation"><span aria-hidden="true"></span>Menu</summary>
        <nav aria-label="Mobile navigation">{{navigation}}</nav>
      </details>
    </header>
    <main class="{{main_class}}" id="main-content">
{{content}}
    </main>
    <footer class="site-footer">
      <span>Guardians of Elysium</span>
      <span>Guild tools and official resources &middot; {{year}}</span>
    </footer>
{{scripts}}
  </body>
</html>
