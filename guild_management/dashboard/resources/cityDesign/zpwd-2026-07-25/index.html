<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>zpwd's City Design — City Map</title>
  <style>
    :root {
      --ink: #f4f7fa;
      --muted: #9daab7;
      --panel: rgba(17, 25, 34, 0.94);
      --panel-border: rgba(255, 255, 255, 0.11);
      --canvas: #091015;
      --accent: #65c8ff;
      --focus: #fff3a3;
      --no-road: #5b21b6;
      --no-road-hover: #a687d8;
      --no-road-selected: #e9d5ff;
      --shadow: 0 16px 42px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100%;
      min-height: 0;
    }

    .toolbar {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(240px, 440px) auto;
      align-items: center;
      gap: 18px;
      min-height: 76px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--panel-border);
      background: #111923;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .identity {
      min-width: 0;
    }

    .eyebrow {
      margin-bottom: 3px;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      overflow: hidden;
      margin: 0;
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 720;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subtitle {
      overflow: hidden;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-wrap {
      position: relative;
    }

    .search {
      width: 100%;
      height: 42px;
      padding: 0 44px 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.055);
      color: var(--ink);
      transition: border-color 140ms ease, background 140ms ease;
    }

    .search::placeholder {
      color: #748290;
    }

    .search:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.075);
    }

    .search-button {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    .search-button:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
    }

    .control,
    .print-button {
      height: 40px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.055);
      font-size: 12px;
      font-weight: 680;
      white-space: nowrap;
      cursor: pointer;
      transition: border-color 130ms ease, background 130ms ease, transform 130ms ease;
    }

    .control.icon-only {
      width: 40px;
      padding: 0;
      font-size: 18px;
    }

    .control:hover,
    .print-button:hover {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.1);
    }

    .control:active,
    .print-button:active {
      transform: translateY(1px);
    }

    .control[aria-pressed="true"] {
      border-color: var(--accent);
      background: rgba(101, 200, 255, 0.13);
      color: #cbeeff;
    }

    .print-button {
      border-color: #4aaee6;
      background: #2795d1;
      color: #06131a;
    }

    .print-button:hover {
      border-color: #7bd2ff;
      background: #64c9ff;
    }

    .map-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(47, 72, 89, 0.26), transparent 46%),
        var(--canvas);
    }

    #city-map {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    #city-map.dragging {
      cursor: grabbing;
    }

    .building-shape {
      stroke: rgba(0, 0, 0, 0.42);
      stroke-width: 1.15;
      vector-effect: non-scaling-stroke;
      transition: fill 160ms ease, opacity 100ms ease, stroke 100ms ease;
    }

    .building {
      cursor: pointer;
      outline: none;
    }

    #city-map:not(.has-selection) .building:hover .building-shape {
      fill: var(--hover-fill, #fff) !important;
    }

    .building:focus-visible .building-shape {
      stroke: rgba(255, 255, 255, 0.88);
      stroke-width: 2;
      stroke-dasharray: 5 3;
    }

    .building.is-selected .building-shape {
      stroke: var(--selection-stroke, #fff);
      stroke-width: 4.5;
      stroke-opacity: 1;
      stroke-dasharray: none;
    }

    .building.is-dimmed {
      opacity: 0.16;
    }

    #city-map.highlight-no-road .building[data-road-independent="true"] .building-shape {
      fill: var(--no-road) !important;
    }

    #city-map.highlight-no-road:not(.has-selection) .building[data-road-independent="true"]:hover .building-shape {
      fill: var(--no-road-hover) !important;
    }

    #city-map.highlight-no-road .building.is-selected[data-road-independent="true"] .building-shape {
      stroke: var(--no-road-selected);
    }

    #city-map.highlight-no-road .building[data-road-independent="true"] .building-label {
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.48);
    }

    .building-label-box {
      pointer-events: none;
    }

    .building-label {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 1px;
      color: #071018;
      font-size: 1px;
      font-weight: 680;
      line-height: 1.12;
      overflow-wrap: anywhere;
      text-align: center;
      text-wrap: balance;
      pointer-events: none;
    }

    .building-label.light-text {
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.42);
    }

    .building-label .dimensions {
      display: block;
      margin-top: 0.22em;
      font-size: 0.82em;
      font-weight: 760;
      opacity: 0.78;
    }

    .floating-panel {
      position: absolute;
      z-index: 10;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .legend {
      bottom: 16px;
      left: 16px;
      width: min(600px, calc(100% - 32px));
      padding: 10px 12px;
    }

    .legend-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 7px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .legend-stats {
      color: var(--muted);
      font-size: 10px;
      font-weight: 560;
      letter-spacing: normal;
      text-align: right;
      text-transform: none;
    }

    .road-toggle {
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 7px;
      margin: 0 0 8px;
      color: #d9e0e6;
      font-size: 10px;
      font-weight: 650;
      cursor: pointer;
      user-select: none;
    }

    .road-toggle input {
      position: relative;
      width: 28px;
      height: 16px;
      flex: 0 0 auto;
      margin: 0;
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      outline: none;
      background: #303b46;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .road-toggle input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #dce4ea;
      transition: transform 140ms ease, background 140ms ease;
    }

    .road-toggle input:checked {
      border-color: #c084fc;
      background: var(--no-road);
    }

    .road-toggle input:checked::after {
      background: #fff;
      transform: translateX(12px);
    }

    .road-toggle input:focus-visible {
      box-shadow: 0 0 0 2px var(--focus);
    }

    .road-toggle-count {
      color: var(--muted);
      font-weight: 560;
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #ced6dd;
      font-size: 10px;
      white-space: nowrap;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 2px;
    }

    .status {
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      padding: 6px 10px;
      color: #cbd4dc;
      font-size: 10px;
      pointer-events: none;
    }

    .status strong {
      color: #fff;
    }

    .details {
      top: 14px;
      right: 14px;
      width: min(295px, calc(100% - 28px));
      padding: 12px;
      opacity: 0;
      transform: translateY(-5px);
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
    }

    .details.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .details-category {
      margin-bottom: 3px;
      color: var(--accent);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .details-name {
      margin: 0;
      color: #fff;
      font-size: 15px;
      line-height: 1.2;
    }

    .details-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .help {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 9;
      color: #76838f;
      font-size: 9px;
      pointer-events: none;
    }

    .print-heading {
      display: none;
    }

    @media (max-width: 900px) {
      .toolbar {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        min-height: 66px;
        padding: 10px;
      }

      .search-wrap {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .controls .label-control {
        display: none;
      }

      .subtitle,
      .help {
        display: none;
      }

      .legend {
        max-height: 106px;
        overflow: auto;
      }
    }

    @media (max-width: 560px) {
      .toolbar {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .controls {
        gap: 4px;
      }

      .control,
      .print-button {
        height: 36px;
      }

      .control.icon-only {
        width: 36px;
      }

      .print-button {
        width: 36px;
        overflow: hidden;
        padding: 0;
        color: transparent;
      }

      .print-button::after {
        content: "PDF";
        display: block;
        color: #06131a;
        font-size: 9px;
        font-weight: 850;
      }

      .details {
        top: 52px;
      }

      .legend-title {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }

      .legend-stats {
        text-align: left;
      }
    }

    @page {
      size: landscape;
      margin: 8mm;
    }

    @media print {
      html,
      body {
        overflow: visible;
        background: #fff;
      }

      .app {
        display: block;
        height: auto;
      }

      .toolbar,
      .floating-panel,
      .help {
        display: none !important;
      }

      .print-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 0 0 4mm;
        color: #111;
      }

      .print-heading h2 {
        margin: 0;
        font-size: 15pt;
      }

      .print-heading p {
        margin: 0;
        color: #555;
        font-size: 8pt;
      }

      .map-stage {
        width: 100%;
        height: 174mm;
        border: 0.25mm solid #777;
        background: #091015 !important;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .building-shape,
      .building-label,
      rect {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="identity">
        <div class="eyebrow">City Design Map</div>
        <h1 id="map-title">zpwd's City Design</h1>
        <div class="subtitle" id="map-subtitle"></div>
      </div>

      <div class="search-wrap">
        <label for="building-search" hidden>Find a building</label>
        <input
          class="search"
          id="building-search"
          type="search"
          autocomplete="off"
          placeholder="Find a building by name…"
        >
        <button class="search-button" id="search-button" type="button" title="Find next building" aria-label="Find next building">⌕</button>
      </div>

      <nav class="controls" aria-label="Map controls">
        <button class="control icon-only" id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
        <button class="control icon-only" id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        <button class="control label-control" id="fit-map" type="button" title="Fit the full map">Fit</button>
        <button class="control" id="rotate-map" type="button" aria-pressed="true" aria-label="Current view: 45 degree side view. Switch to top view" title="Switch to top view">45° View</button>
        <button class="print-button" id="print-map" type="button" title="Print or save this map as a PDF">Print / PDF</button>
      </nav>
    </header>

    <section class="map-stage" aria-label="Interactive city map">
      <div class="print-heading">
        <h2>zpwd's City Design</h2>
        <p id="print-subtitle"></p>
      </div>
      <svg class="highlight-no-road is-side-view" id="city-map" role="application" aria-label="Zoomable 2-D city map" tabindex="0">
        <defs>
          <pattern id="tile-grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <rect width="48" height="48" fill="#fff9a9"></rect>
            <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#d9cd4f" stroke-width="1"></path>
          </pattern>
        </defs>
        <g id="map-layer">
          <g id="unlocked-layer"></g>
          <g id="building-layer"></g>
        </g>
      </svg>

      <div class="floating-panel status" aria-live="polite">
        <span><strong id="zoom-status">100%</strong> zoom</span>
        <span id="rotation-status">45° side view</span>
        <span id="search-status"></span>
      </div>

      <aside class="floating-panel details" id="building-details" aria-live="polite">
        <div class="details-category" id="details-category"></div>
        <h2 class="details-name" id="details-name"></h2>
        <div class="details-meta" id="details-meta"></div>
      </aside>

      <aside class="floating-panel legend" aria-label="Map color legend">
        <div class="legend-title">
          <span>Color key</span>
          <span class="legend-stats" id="legend-stats"></span>
        </div>
        <label class="road-toggle" for="no-road-toggle">
          <input id="no-road-toggle" type="checkbox" checked>
          <span>Highlight no-road buildings in purple</span>
          <span class="road-toggle-count" id="no-road-count"></span>
        </label>
        <div class="legend-items" id="legend-items"></div>
      </aside>

      <div class="help">Click to select/unselect · Scroll to zoom · Drag to pan · R switch view · 0 fit · P print</div>
    </section>
  </main>
